name: Deploy Auth Service

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy Auth Service
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            cd /opt/wingding &&
            POSTGRES_USER='${{ secrets.POSTGRES_USER }}' \
            POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            POSTGRES_HOST='${{ secrets.POSTGRES_HOST }}' \
            POSTGRES_PORT='${{ secrets.POSTGRES_PORT }}' \
            ASPNETCORE_ENVIRONMENT='${{ secrets.ASPNETCORE_ENVIRONMENT }}' \
            AUTH_ASPNETCORE_URLS='${{ secrets.AUTH_ASPNETCORE_URLS }}' \
            AUTH_API_PORT='${{ secrets.AUTH_API_PORT }}' \
            REDIS_HOST='${{ secrets.REDIS_HOST }}' \
            REDIS_PORT='${{ secrets.REDIS_PORT }}' \
            REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}' \
            KEYCLOAK_BASE_URL='${{ secrets.KEYCLOAK_BASE_URL }}' \
            KEYCLOAK_ADMIN_URL='${{ secrets.KEYCLOAK_ADMIN_URL }}' \
            KEYCLOAK_TOKEN_URL='${{ secrets.KEYCLOAK_TOKEN_URL }}' \
            KEYCLOAK_ADMIN_CLIENT_ID='${{ secrets.KEYCLOAK_ADMIN_CLIENT_ID }}' \
            KEYCLOAK_ADMIN_CLIENT_SECRET='${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}' \
            KEYCLOAK_AUTH_CLIENT_ID='${{ secrets.KEYCLOAK_AUTH_CLIENT_ID }}' \
            KEYCLOAK_AUTH_CLIENT_SECRET='${{ secrets.KEYCLOAK_AUTH_CLIENT_SECRET }}' \
            AUTH_AUDIENCE='${{ secrets.AUTH_AUDIENCE }}' \
            AUTH_ISSUER='${{ secrets.AUTH_ISSUER }}' \
            AUTH_METADATA_URL='${{ secrets.AUTH_METADATA_URL }}' \
            KAFKA_BOOTSTRAP_SERVERS='${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}' \
            docker compose up -d --build auth-service &&
            docker builder prune -af || true &&
            docker image prune -f || true
          "
