name: Build

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Клонирует репозиторий на runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Устанавливает .NET 10 SDK
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Скачивает NuGet-зависимости
      - name: Restore dependencies
        run: dotnet restore WingDing-Party.sln

      # Собирает все проекты в Release-конфигурации
      - name: Build solution
        run: dotnet build WingDing-Party.sln --no-restore --configuration Release
