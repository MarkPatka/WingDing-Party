services:
  user-service:
    image: ${DOCKER_REGISTRY-}userserviceapi
    build:
      context: .
      dockerfile: src/UserService/UserService.Api/Dockerfile
    container_name: user_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:5100
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${USER_POSTGRES_DB:-userdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - CONNECTION_STRING=Host=postgres;Port=5432;Database=${USER_POSTGRES_DB:-userdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - FILESTORAGE__ENDPOINT=minio:9000
      - FILESTORAGE__ACCESSKEY=minio
      - FILESTORAGE__SECRETKEY="minio1234"
      - FILESTORAGE__AVATARBUCKET="avatars"
      - FILESTORAGE__WITHSSL="false"
    ports:
      - "${USER_API_PORT:-5100}:5100"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wingding_network
    volumes:
      - ./logs/user-service:/app/logs

  auth-service:
    image: ${DOCKER_REGISTRY-}authserviceapi
    build:
      context: .
      dockerfile: src/AuthService/AuthService.Api/Dockerfile
    container_name: auth_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:5200
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${AUTH_POSTGRES_DB:-authdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - CONNECTION_STRING=Host=postgres;Port=5432;Database=${AUTH_POSTGRES_DB:-authdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${AUTH_API_PORT:-5200}:5200"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wingding_network
    volumes:
      - ./logs/auth-service:/app/logs

  event-service:
    image: ${DOCKER_REGISTRY-}eventserviceapi
    build:
      context: .
      dockerfile: src/EventService/EventService.Api/Dockerfile
    container_name: event_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:5300
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${EVENT_POSTGRES_DB:-eventdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - CONNECTION_STRING=Host=postgres;Port=5432;Database=${EVENT_POSTGRES_DB:-eventdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${EVENT_API_PORT:-5300}:5300"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wingding_network
    volumes:
      - ./logs/event-service:/app/logs

  club-service:
    image: ${DOCKER_REGISTRY-}clubserviceapi
    build:
      context: .
      dockerfile: src/ClubService/ClubService.Api/Dockerfile
    container_name: club_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=${CLUB_ASPNETCORE_URLS:-http://+:5400}
      - POSTGRES_HOST=${CLUB_POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${CLUB_POSTGRES_PORT:-5432}
      - POSTGRES_DB=${CLUB_POSTGRES_DB:-clubdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - CONNECTION_STRING=Host=postgres;Port=5432;Database=${CLUB_POSTGRES_DB:-clubdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${CLUB_API_PORT:-5400}:5400"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wingding_network
    volumes:
      - ./logs/club-service:/app/logs

networks:
  wingding_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  kafka_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
